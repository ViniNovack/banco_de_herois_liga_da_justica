<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./tabela.css">
</head>
<body>

    <div id="content">


        <div id="menu">
            <button id="botao_editar">✎</button>

            <div id="opcoes" class="opcoes">
                <button id="botao_novo">Novo</button>
                <button id="botao_deletar">Deletar</button>
            </div>
        </div>


        <div id="forms_novo" class="forms_novo">
            <h3>Cadastrar Herói</h3>

            <form id="forms_heroi">
                <input type="text" id="nome" placeholder="Nome do herói">
                
            </form>
        </div>
        

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Identidade_Secreta</th>
                    <th>Equipe</th>
                    <th>Classificação</th>
                </tr>
            </thead>
            <tbody id="corpo_tabela">

            </tbody>
        </table>


    </div>


    <script src="./tabela.js" defer></script>
</body>
</html>
