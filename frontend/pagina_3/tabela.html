<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./tabela.css">
</head>
<body>

    <div id="content">


        <div id="menu">
            <button id="botao_editar">✎</button>

            <div id="opcoes" class="opcoes">
                <button id="botao_novo">Novo</button>
                <button id="botao_deletar">Deletar</button>
            </div>
        </div>


        <div id="forms_novo" class="forms_novo">
            <h3>Cadastrar Herói</h3>

            <form id="forms_heroi">
                <input type="text" id="nome" placeholder="Nome do herói" required> <!-- o "required" torna o campo obrigatorio -->
                <input type="number" id="ano" placeholder="Nascimento" required>
                <input type="text" id="identidade_secreta" placeholder="Identidade secreta" required>
                <input type="text" id="equipe" placeholder="Equipe" required>
                <select id="classificacao" required>
                    <option value="">Selecione a classificação</option>
                    <option value="urbano">Urbano</option>
                    <option value="cósmico">Cósmico</option>
                    <option value="ômega">Ômega</option>
                    <option value="velocista">Velocista</option>
                    <option value="amazona">Amazona</option>
                    <option value="lanterna">Lanterna</option>
                    <option value="mágico">Mágico</option>
                    <option value="mitológico">Mitológico</option>
                    <option value="cientista">Cientista</option>
                </select>
                <input type="text" id="url_link" placeholder="URL da imagem">
                <textarea id="origem" placeholder="Origem do herói"></textarea>

                <button type="submit">Cadastrar</button>
                <button type="button" id="cancelar_novo">Cancelar</button>

            </form>
        </div>
        

        <div id="forms_delet" class="forms_delet">
            <h3>Remover Herói</h3>

            <form id="forms_deletar" class="form_deletar">
                <input type="text" id="nome_a_deletar" placeholder="Nome do herói" required>

                <button type="submit">Deletar</button>
                <button type="button" id="cancelar_deletar">Cancelar</button>
            </form>
        </div>

        
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Identidade_Secreta</th>
                    <th>Equipe</th>
                    <th>Classificação</th>
                </tr>
            </thead>
            <tbody id="corpo_tabela">

            </tbody>
        </table>


    </div>


    <script type="module" src="./tabela_insert.js" defer></script>
</body>
</html>
